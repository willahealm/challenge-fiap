plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
}
group = 'br.com.fiap'
version = '0.1.0'
// Optional output outside synchronized folders when Windows/OneDrive locks reports.
if (providers.gradleProperty('buildOutput').isPresent()) {
    layout.buildDirectory = file(providers.gradleProperty('buildOutput').get())
}
repositories { mavenCentral() }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.16')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') { useJUnitPlatform(); systemProperty 'contracts.path', file('../../packages/contracts').absolutePath }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
