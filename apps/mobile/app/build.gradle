plugins {
    id "com.android.application"
}

def repoEnv = new Properties()
def repoEnvFile = rootProject.file("../../.env")
if (repoEnvFile.exists()) {
    repoEnvFile.withInputStream { repoEnv.load(it) }
}
def envValue = { String name, String fallback ->
    System.getenv(name) ?: repoEnv.getProperty(name, fallback)
}
def javaString = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}
def appwriteEndpoint = envValue("APPWRITE_ENDPOINT", "https://fra.cloud.appwrite.io/v1").replaceAll('/+$', '')
def appwriteProjectId = envValue("APPWRITE_PROJECT_ID", "")
def appwriteFunctionId = envValue("APPWRITE_FUNCTION_ID", "")
def useAppwriteGateway = !appwriteProjectId.isBlank() && !appwriteFunctionId.isBlank()
def androidApiUrl = envValue("ANDROID_API_URL", appwriteEndpoint) + "/"
def androidDemoDefault = envValue("ANDROID_DEMO_MODE_DEFAULT", useAppwriteGateway ? "false" : "true")

android {
    namespace "br.com.fiap.embarquefacil"
    compileSdk 36
    defaultConfig {
        applicationId "br.com.fiap.embarquefacil"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0-demo"

        buildConfigField "String", "DEFAULT_API_URL", javaString(androidApiUrl)
        buildConfigField "boolean", "DEMO_MODE_DEFAULT", androidDemoDefault
        buildConfigField "boolean", "USE_APPWRITE_GATEWAY", useAppwriteGateway.toString()
        buildConfigField "String", "APPWRITE_ENDPOINT", javaString(appwriteEndpoint)
        buildConfigField "String", "APPWRITE_PROJECT_ID", javaString(appwriteProjectId)
        buildConfigField "String", "APPWRITE_FUNCTION_ID", javaString(appwriteFunctionId)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity:1.10.1"
    implementation "androidx.fragment:fragment:1.8.6"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.8.7"
    implementation "androidx.lifecycle:lifecycle-livedata:2.8.7"
    implementation "androidx.navigation:navigation-fragment:2.8.9"
    implementation "androidx.navigation:navigation-ui:2.8.9"
    implementation "com.google.android.material:material:1.12.0"

    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"

    implementation "androidx.camera:camera-camera2:1.4.2"
    implementation "androidx.camera:camera-lifecycle:1.4.2"
    implementation "androidx.camera:camera-view:1.4.2"
    implementation "com.google.mlkit:barcode-scanning:17.3.0"
    implementation "com.google.zxing:core:3.5.3"

    testImplementation "junit:junit:4.13.2"
}
